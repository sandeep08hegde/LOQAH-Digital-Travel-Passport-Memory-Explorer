services:
  postgres:
    image: postgres:16-alpine
    container_name: loqah-postgres
    environment:
      POSTGRES_DB: loqah
      POSTGRES_USER: loqah
      POSTGRES_PASSWORD: loqah
    ports:
      - "5432:5432"
    volumes:
      - loqah_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loqah -d loqah"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  loqah_data:
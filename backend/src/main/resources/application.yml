server:
  port: ${PORT:8080}
spring:
  application:
    name: loqah-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loqah}
    username: ${DB_USERNAME:loqah}
    password: ${DB_PASSWORD:loqah}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456}
    expiration-seconds: 86400
logging:
  level:
    org.springframework.security: INFO